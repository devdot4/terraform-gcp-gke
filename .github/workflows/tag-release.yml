name: Auto Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            git fetch --tags --force origin

            LATEST=$(git tag --sort=-v:refname | head -n 1)

            if [ -z "$LATEST" ]; then
              NEXT="0.0.1"
            else
              PATCH=$(echo "$LATEST" | cut -d. -f3)
              NEXT="0.0.$((PATCH + 1))"
            fi

            echo "Attempt $attempt: latest=$LATEST next=$NEXT"

            if git ls-remote --tags origin "refs/tags/$NEXT" | grep -q "$NEXT"; then
              echo "Tag $NEXT already exists on remote, retrying..."
              sleep $((RANDOM % 5 + 1))
              continue
            fi

            git tag "$NEXT"
            if git push origin "$NEXT"; then
              echo "Created tag: $NEXT"
              break
            else
              echo "Push failed (likely a race), retrying..."
              git tag -d "$NEXT"
              sleep $((RANDOM % 5 + 1))
              NEXT=""
            fi
          done

          if [ -z "$NEXT" ]; then
            echo "Failed to create a unique tag after retries."
            exit 1
          fi

          echo "Creating release: $NEXT"

          gh release create "$NEXT" \
            --title "Release $NEXT" \
            --generate-notes